name: ai_recipe_generator
description: "AI Recipe Generator using Flutter, Firebase and Gemini"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # Google Sign-In (v7 API)
  google_sign_in: ^7.2.0

  # Networking (direct Gemini + TheMealDB)
  http: ^1.2.0

  # State Management
  provider: ^6.1.5
  image_picker: ^1.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - env.json

  # Poppins bundled locally (weights 400/500/600/700) to remove the
  # google_fonts runtime network fetch — correct typography offline and
  # at first paint. Family name 'Poppins' is referenced by AppTextStyles
  # and the ThemeData fontFamily.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700