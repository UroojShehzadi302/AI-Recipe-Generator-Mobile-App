name: ai_recipe_generator
description: "AI Recipe Generator using Flutter, Firebase and Gemini"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # Google Sign-In (v7 API)
  google_sign_in: ^7.2.0

  # Networking (direct Gemini + TheMealDB)
  http: ^1.2.0

  # State Management
  provider: ^6.1.5
  image_picker: ^1.2.3
  firebase_remote_config: ^6.5.5
  firebase_messaging: ^16.4.3
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Android launcher icon, generated from the brand logo.
# Regenerate after changing assets/images/logo.png with:
#   dart run flutter_launcher_icons
# The adaptive-icon background is primaryDark (#5E3D26) so the Android 8+
# circular/squircle mask blends with the logo's own brown field instead of
# exposing a white corner.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#5E3D26"
  adaptive_icon_foreground: "assets/images/logo.png"
  # Android crops the outer ~33% of an adaptive foreground; the inset keeps the
  # pot and the circuit-tree inside the safe zone instead of clipping them.
  adaptive_icon_foreground_inset: 18
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - env.json

  # Poppins bundled locally (weights 400/500/600/700) to remove the
  # google_fonts runtime network fetch — correct typography offline and
  # at first paint. Family name 'Poppins' is referenced by AppTextStyles
  # and the ThemeData fontFamily.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700