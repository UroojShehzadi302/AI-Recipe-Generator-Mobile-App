# Workaround for a Kotlin 2.3.x incremental-compilation bug on Windows that
# fails compiling google_sign_in_android with "Could not close incremental
# caches ... is already registered". Disabling incremental Kotlin compilation
# sidesteps the corrupt cache-close path. Safe to remove once the toolchain
# (Kotlin/Gradle) is upgraded past the fix.
kotlin.incremental=false
